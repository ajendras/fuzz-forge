openapi: 3.0.0
info:
  title: Petstore
  version: 1.0.0
servers:
  - url: http://localhost:8000
paths:
  /pets:
    get:
      summary: List all pets
      responses:
        '200':
          description: A list of pets
    post:
      summary: Create a pet
      responses:
        '200':
          description: Pet created
  /pets/{petId}:
    get:
      summary: Find pet by ID
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Expected response to a valid request
