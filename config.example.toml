# Fuzz Forge Configuration Example
# Safe defaults for local LLM API fuzzing

model = "llama3.2"
limit = 20
dry_run = true
rate_limit_rps = 5.0
allowed_hosts = ["localhost", "127.0.0.1", "example.com"]

enabled_mutators = [
    "injection",
    "auth_bypass",
    "logic",
]

[reporting]
output_dir = "fuzz-reports"
formats = ["html", "json", "sarif"]
include_curl = true
