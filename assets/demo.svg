<svg xmlns="http://www.w3.org/2000/svg" width="900" height="572" viewBox="0 0 900 572" role="img" aria-label="Fuzz Forge — demo">
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;font-size:15px}
    .l{opacity:0}
    .ty{clip-path:inset(0 100% 0 0)}
    .cur{animation:blink 1s steps(1) infinite}
    @keyframes show{to{opacity:1}}
    @keyframes type{to{clip-path:inset(0 0 0 0)}}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.l{opacity:1;animation:none!important}.ty{clip-path:none;animation:none!important}}
  </style>
  <rect width="900" height="572" rx="14" fill="#0d1117"/>
  <rect x=".5" y=".5" width="899" height="572" rx="14" fill="none" stroke="#30363d"/>
  <rect width="900" height="40" rx="14" fill="#161b22"/><rect y="26" width="900" height="14" fill="#161b22"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f57"/><circle cx="44" cy="20" r="6" fill="#febc2e"/><circle cx="64" cy="20" r="6" fill="#28c840"/>
  <text x="450" y="25" text-anchor="middle" fill="#8b949e" style="font-size:13px">Fuzz Forge — demo</text>
<text x="28" y="74" class="l" style="animation:show .01s 0.60s forwards"><tspan fill="#ffff00">❯</tspan></text><text x="50" y="74" class="l ty" style="animation:show .01s 0.60s forwards,type 0.99s steps(22) 0.60s forwards" fill="#e5e7eb">pip install fuzz-forge</text>
<text x="50" y="100" class="l" style="animation:show .01s 1.89s forwards" fill="#94a3b8">Collecting fuzz-forge</text>
<text x="50" y="126" class="l" style="animation:show .01s 2.11s forwards" fill="#94a3b8">Downloading packages ...</text>
<text x="50" y="152" class="l" style="animation:show .01s 2.33s forwards" fill="#4ade80">Successfully installed fuzz-forge-0.1.0 httpx pydantic prance ollama</text>
<text x="28" y="204" class="l" style="animation:show .01s 2.90s forwards"><tspan fill="#ffff00">❯</tspan></text><text x="50" y="204" class="l ty" style="animation:show .01s 2.90s forwards,type 1.98s steps(44) 2.90s forwards" fill="#e5e7eb">fuzzforge init --spec examples/petstore.yaml</text>
<text x="50" y="230" class="l" style="animation:show .01s 5.18s forwards" fill="#94a3b8">✅ Parsed OpenAPI v3 spec with 4 paths</text>
<text x="50" y="256" class="l" style="animation:show .01s 5.40s forwards" fill="#94a3b8">Created config.toml with default mutators</text>
<text x="50" y="282" class="l" style="animation:show .01s 5.62s forwards" fill="#94a3b8">Ready to scan — run: fuzzforge scan petstore.yaml</text>
<text x="28" y="334" class="l" style="animation:show .01s 6.19s forwards"><tspan fill="#ffff00">❯</tspan></text><text x="50" y="334" class="l ty" style="animation:show .01s 6.19s forwards,type 2.20s steps(65) 6.19s forwards" fill="#e5e7eb">fuzzforge scan examples/petstore.yaml --model llama3.2 --limit 12</text>
<text x="50" y="360" class="l" style="animation:show .01s 8.69s forwards" fill="#94a3b8">Connecting to Ollama (llama3.2)...</text>
<text x="50" y="386" class="l" style="animation:show .01s 8.91s forwards" fill="#94a3b8">Generated 12 context-aware test cases</text>
<text x="50" y="412" class="l" style="animation:show .01s 9.13s forwards" fill="#94a3b8">Executed 12 requests (0.8s)</text>
<text x="50" y="438" class="l" style="animation:show .01s 9.35s forwards" fill="#94a3b8">2 potential issues found. Open report.html</text>
<text x="28" y="490" class="l" style="animation:show .01s 9.92s forwards"><tspan fill="#ffff00">❯</tspan></text><text x="50" y="490" class="l ty" style="animation:show .01s 9.92s forwards,type 1.22s steps(27) 9.92s forwards" fill="#e5e7eb">cat report.html | head -n 8</text>
<text x="50" y="516" class="l" style="animation:show .01s 11.44s forwards" fill="#94a3b8">&lt;!DOCTYPE html&gt;</text>
<g class="l" style="animation:show .01s 11.66s forwards"><text x="28" y="542" fill="#ffff00">❯</text><rect class="cur" x="50" y="527" width="10" height="18" fill="#e5e7eb"/></g>
</svg>
